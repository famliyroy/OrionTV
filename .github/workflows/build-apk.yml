name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      # custom：v1.x 发布线（保持不动）
      # rewrite/v2：v2.x 原生重构发布线（版本号取自本分支的 package.json）
      - custom
      - rewrite/v2

permissions:
  contents: write

jobs:
  direct_build:
    name: Build Android TV APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn install

      - name: Get version from package.json
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Prebuild TV App
        run: yarn prebuild
        env:
          EXPO_TV: 1

      - name: Build TV APK
        run: yarn build
        env:
          EXPO_TV: 1

      - name: Rename APK file
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/orionTV.${{ steps.package-version.outputs.version }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orionTV.${{ steps.package-version.outputs.version }}.apk
          path: artifacts/orionTV.${{ steps.package-version.outputs.version }}.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package-version.outputs.version }}
          name: Release v${{ steps.package-version.outputs.version }}
          # 不指定的话 action 默认把 tag 打在**仓库默认分支**上，于是 v2.0.0 的 tag
          # 指向 master、源代码压缩包与 APK 对不上。这里钉死成实际构建的那个提交。
          target_commitish: ${{ github.sha }}
          body: Automated release for version v${{ steps.package-version.outputs.version }} from ${{ github.ref_name }}.
          draft: false
          prerelease: false
          files: artifacts/orionTV.${{ steps.package-version.outputs.version }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
